<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Frankrijklei Rooftop – 3D walkthrough</title>
    <link rel="stylesheet" href="/src/ui/hud.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="start" class="overlay">
      <div class="card">
        <h1>Rooftop apartment · Frankrijklei, Antwerp</h1>
        <p>Click to walk around. Move with <b>W A S D</b>, look with the mouse, hold <b>Shift</b> to run.</p>
        <p class="sub" id="start-status">Preparing textures…</p>
      </div>
    </div>
    <div id="help" class="panel">
      <div><b>WASD</b> walk · <b>Shift</b> run</div>
      <div><b>Mouse</b> look · <b>Esc</b> release mouse</div>
      <div><b>F</b> FPS · <b>H</b> hide help</div>
    </div>
    <div id="fps" class="panel hidden"></div>
    <div id="crosshair" class="hidden"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
